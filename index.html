<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARBER OS</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(120% 90% at 50% 22%, #164733 0%, #0f3626 55%, #0a2b1e 100%);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#eaf2ec;}
  /* Pantalla de acceso */
  #access{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 22px;}
  .wrap{width:100%;max-width:380px;text-align:center;}
  img.logo{width:112px;height:112px;border-radius:26px;object-fit:cover;display:block;margin:0 auto 22px;}
  h1{margin:0 0 14px;font-size:30px;font-weight:800;letter-spacing:.5px;color:#fff;}
  p.sub{margin:0 auto 26px;font-size:15px;line-height:1.5;color:#a9c2b4;max-width:320px;}
  p.sub b{color:#eaf2ec;}
  input{width:100%;padding:15px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;font-size:16px;text-align:center;}
  input::placeholder{color:#7f9a8c;}
  input:focus{outline:none;border-color:#2fae7c;background:rgba(255,255,255,.09);}
  button.entrar{width:100%;margin-top:14px;padding:15px;background:#1f9d6b;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;}
  button.entrar:active{opacity:.9;}
  #err{margin-top:16px;font-size:14px;color:#f4b0a8;display:none;}
  p.note{margin:26px auto 0;font-size:13px;line-height:1.5;color:#7f9a8c;max-width:300px;}
  /* Panel embebido (oculta el Apps Script) */
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f4f4f5;}
  #salir{position:fixed;top:10px;right:12px;z-index:10;display:none;background:rgba(0,0,0,.35);color:#fff;
    border:none;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);}
</style></head>

  <iframe id="frame" title="Panel"></iframe>
  <button id="salir">Cambiar llave</button>

  <script>
  /* ======================================================================
     CONFIGURACIÓN — edita SOLO estas dos líneas por cada barbería:
     ====================================================================== */
  var EXEC_URL = "https://script.google.com/macros/s/AKfycbyWEhzMPTMvMQsZFBzJHf_rm4GvIY9Hg_B2SQ4Htp0v4sicxKk/exec?page=panel&key=2f481ced
";   // termina en /exec
  var NOMBRE   = "BARBER OS";                                  // nombre que se muestra en la entrada
  /* ====================================================================== */

  var LS = 'barberos_key';
  var access = document.getElementById('access');
  var frame  = document.getElementById('frame');
  var salir  = document.getElementById('salir');
  var pin = document.getElementById('pin');
  var err = document.getElementById('err');

  document.getElementById('titulo').textContent = NOMBRE;
  document.getElementById('logo').alt = NOMBRE;
  document.getElementById('note').textContent = 'Solo la primera vez. Después ' + NOMBRE + ' recuerda tu llave y entra directo.';

  function panelUrl(k){ return EXEC_URL + '?page=panel&key=' + encodeURIComponent(k); }

  function abrirPanel(k){
    frame.src = panelUrl(k);
    access.style.display = 'none';
    frame.style.display  = 'block';
    salir.style.display  = 'block';
  }

  // Si ya recordamos la llave, entra directo (sin mostrar el Apps Script)
  try {
    var saved = localStorage.getItem(LS);
    if (saved) { abrirPanel(saved); }
  } catch(e){}

  function entrar(){
    var k = (pin.value || '').trim();
    if (!k) { err.style.display = 'block'; return; }
    try { localStorage.setItem(LS, k); } catch(e){}
    abrirPanel(k);
  }
  document.getElementById('go').addEventListener('click', entrar);
  pin.addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); });

  // Por si la llave quedó mal: olvidarla y volver a la entrada
  salir.addEventListener('click', function(){
    try { localStorage.removeItem(LS); } catch(e){}
    location.reload();
  });

  pin.focus();
  </script>
</body></html>
